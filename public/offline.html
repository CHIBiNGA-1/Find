<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2a3cff" />
<title>Offline · f!nd</title>
<style>
  :root { --cobalt: #2a3cff; --ink: #0e1240; --hl: #ffe94a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: var(--cobalt); color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; -webkit-tap-highlight-color: transparent; }
  main { max-width: 22rem; }
  .mark { font-size: 5.5rem; font-weight: 800; letter-spacing: -0.05em; line-height: 1; margin: 0 0 2rem; font-stretch: 75%; }
  .mark span { background: var(--hl); color: var(--ink); border-radius: 0.16em; padding: 0 0.09em; margin: 0 0.03em; }
  h1 { font-size: 1.75rem; line-height: 1.1; margin: 0 0 0.75rem; }
  p { margin: 0 0 2rem; line-height: 1.5; color: rgb(255 255 255 / 0.85); }
  button { min-height: 52px; padding: 0 2rem; border: 0; border-radius: 12px; background: #fff; color: var(--ink); font: inherit; font-weight: 700; font-size: 1.0625rem; cursor: pointer; }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 0 5px var(--hl); }
</style>
</head>
<body>
<main>
  <p class="mark" aria-hidden="true">f<span>!</span>nd</p>
  <h1>You&rsquo;re offline</h1>
  <p>Listings and messages need a connection. We&rsquo;ll bring you back as soon as you&rsquo;re online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
