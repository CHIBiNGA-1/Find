<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f6b4f" />
  <title>You're offline — f!nd</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --brand: #0f6b4f; --bg: #f6f7f4; --text: #1a1a1a; --muted: #6b7280; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 24rem;
      width: 100%;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .icon {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 50%;
      background: #e6f4ef;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: .625rem;
    }
    p {
      font-size: .9375rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0 1.5rem;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      font-size: .9375rem;
      border-radius: .625rem;
      text-decoration: none;
      transition: opacity .15s;
    }
    a:hover { opacity: .88; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f6b4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 6s4-2 11-2 11 2 11 2"/>
        <path d="M1 6v12l11 4 11-4V6"/>
        <line x1="12" y1="8" x2="12" y2="20"/>
        <line x1="1" y1="6" x2="12" y2="8"/>
        <line x1="23" y1="6" x2="12" y2="8"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Connect to your campus Wi‑Fi or mobile data, then tap the button below to pick up where you left off.</p>
    <a href="/" onclick="location.reload();return false;">Try again</a>
  </div>
</body>
</html>
